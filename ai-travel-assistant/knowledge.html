<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行程组件库 - AI智能计调助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .knowledge-content {
      padding-top: calc(var(--nav-height) + 24px);
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 24px;
      height: 100vh;
      overflow-y: auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .component-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-sidebar);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .component-table {
      min-width: 1100px;
    }

    .component-table th,
    .component-table td {
      vertical-align: top;
    }

    .component-name {
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .component-copy {
      max-width: 360px;
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .component-source {
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .tag-line {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .resource-chip,
    .quote-chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin: 0 4px 5px 0;
      background: var(--bg-sidebar);
      color: var(--text-secondary);
    }

    .resource-chip.available {
      background: var(--success-bg);
      color: var(--success);
    }

    .resource-chip.missing {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .quote-chip.ready {
      background: var(--success-bg);
      color: var(--success);
    }

    .quote-chip.partial {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .quote-chip.blocked {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .quote-chip.review {
      background: var(--info-bg);
      color: var(--info);
    }

    .action-stack {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 230px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .detail-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-sidebar);
      padding: 10px 12px;
    }

    .detail-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .detail-item strong {
      color: var(--text-primary);
      font-size: 14px;
    }

    .resource-matrix {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .resource-row {
      display: grid;
      grid-template-columns: 130px 1fr 110px;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
      align-items: center;
    }

    .resource-row:last-child {
      border-bottom: none;
    }

    .need-editor {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: auto;
      margin-bottom: 12px;
      background: var(--bg-card);
    }

    .need-editor-head,
    .need-editor-row {
      display: grid;
      grid-template-columns: 108px 132px 154px 154px minmax(220px, 1fr) 136px 72px;
      gap: 8px;
      align-items: center;
      min-width: 1080px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-light);
    }

    .need-editor-head {
      background: var(--bg-sidebar);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .need-editor-row:last-child {
      border-bottom: none;
    }

    .need-inline {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 6px;
    }

    .need-editor .form-input,
    .need-editor .form-select {
      height: 34px;
      font-size: 12px;
      padding: 6px 8px;
    }

    .filter-bar {
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .knowledge-content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel-head {
        flex-direction: column;
        align-items: stretch;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="knowledge-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">行程组件库</h1>
      </div>
      <button class="btn btn-primary" onclick="openComponentEditor()">＋ 添加组件</button>
    </div>

    <div class="filter-bar">
      <input type="text" class="form-input" id="keywordFilter" style="width:220px;" placeholder="搜索城市、组件、标签...">
      <select class="form-select" id="audienceFilter" style="width:150px;">
        <option>所有客群</option>
        <option>商务</option>
        <option>亲子</option>
        <option>蜜月</option>
        <option>团建</option>
        <option>摄影</option>
      </select>
      <select class="form-select" id="resourceFilter" style="width:160px;">
        <option>所有资源</option>
        <option>酒店</option>
        <option>机票</option>
        <option>用车</option>
        <option>司导</option>
        <option>会议室</option>
        <option>晚宴</option>
        <option>保险</option>
        <option>门票/活动</option>
        <option>餐食</option>
        <option>区间交通</option>
      </select>
      <button class="btn btn-secondary" onclick="renderComponents()">筛选</button>
    </div>

    <div class="component-panel">
      <div class="panel-head">
        <div class="panel-title">组件台账</div>
        <button class="btn btn-secondary btn-sm" onclick="showUploadRule()">上传文件拆解规则</button>
      </div>
      <div class="table-wrapper" style="border:0;border-radius:0;">
        <table class="component-table">
          <thead>
            <tr>
              <th>行程组件</th>
              <th>类型/时长</th>
              <th>适合客群</th>
              <th>所需报价资源</th>
              <th>可报价状态</th>
              <th>来源</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="componentTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderNavbar('knowledge');

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function tagsOf(seg) {
      return Array.isArray(seg.tags) ? seg.tags : [];
    }

    function componentType(seg) {
      if (seg.componentType) return seg.componentType;
      const haystack = [seg.from, seg.to, seg.desc, seg.audience, ...tagsOf(seg)].join(' ');
      if (/商务|会议|团建/.test(haystack)) return '商务/团建组件';
      if (/酒店|温泉|岛|水屋|住宿/.test(haystack)) return '住宿度假组件';
      if (/动物园|门票|体验|景点|卢浮宫|少女峰/.test(haystack)) return '景点体验组件';
      if (/火车|TGV|瑞铁|小田急|交通|快车/.test(haystack)) return '城市衔接组件';
      return '行程组件';
    }

    function requiredResources(seg) {
      return AppStore.componentNeeds(seg);
    }

    function resourceLabel(need, withQty = true) {
      const name = need.resource || need.label || need.category || '资源';
      if (!withQty || !need.quantity) return name;
      const unit = need.unit || '';
      const quantity = Number(need.quantity || 0);
      const amount = quantity === 1 && /半日|全日/.test(unit) ? unit : `${need.quantity}${unit}`;
      return `${name} ${amount}`;
    }

    function pricesForResource(need, seg, prices) {
      return AppStore.matchPricesForNeed(need, seg, prices);
    }

    function quoteState(seg, prices = AppStore.all().prices) {
      const resources = requiredResources(seg);
      if (seg.status === 'review') return { key: 'review', text: '待审核入库', matched: 0, total: resources.length, missing: resources };
      const quote = AppStore.buildQuoteForComponent(seg.id || seg, { data: { ...AppStore.all(), prices } });
      const missing = quote.missing || [];
      if (!missing.length) return { key: 'ready', text: '可生成报价', matched: quote.matchedCount, total: quote.totalNeeds, missing, totalAmount: quote.total };
      if (missing.length < resources.length) return { key: 'partial', text: '部分缺价', matched: quote.matchedCount, total: quote.totalNeeds, missing };
      return { key: 'blocked', text: '缺少价格', matched: 0, total: quote.totalNeeds || resources.length, missing };
    }

    function normalizedComponents() {
      const prices = AppStore.all().prices;
      return AppStore.all().segments
        .filter(seg => seg.status !== 'rejected')
        .map(seg => ({ ...seg, type: componentType(seg), resources: requiredResources(seg), quoteState: quoteState(seg, prices) }));
    }

    function filteredComponents() {
      const keyword = (document.getElementById('keywordFilter')?.value || '').trim().toLowerCase();
      const audience = document.getElementById('audienceFilter')?.value || '所有客群';
      const resource = document.getElementById('resourceFilter')?.value || '所有资源';
      return normalizedComponents().filter(seg => {
        if (audience !== '所有客群' && ![seg.audience, seg.desc, ...tagsOf(seg)].join(' ').includes(audience)) return false;
        if (resource !== '所有资源' && !seg.resources.some(need => [need.resource, need.category, need.label, need.quoteGroup].includes(resource))) return false;
        if (keyword) {
          const haystack = [seg.from, seg.to, seg.type, seg.desc, seg.source, seg.audience, ...tagsOf(seg), ...seg.resources.map(need => resourceLabel(need))].join(' ').toLowerCase();
          if (!haystack.includes(keyword)) return false;
        }
        return true;
      });
    }

    function renderComponents() {
      const segments = filteredComponents();

      const tbody = document.getElementById('componentTableBody');
      if (!segments.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-text">没有匹配组件</div><div class="empty-sub">请调整筛选条件，或从文件管理页审核新组件。</div></div></td></tr>';
        return;
      }

      tbody.innerHTML = segments.map(seg => `
        <tr onclick="viewComponent('${seg.id}')">
          <td>
            <div class="component-name">${esc(seg.from)} → ${esc(seg.to)}</div>
            <div class="component-copy">${esc(seg.desc)}</div>
          </td>
          <td>
            <strong>${esc(seg.type)}</strong>
            <div class="component-source">${esc(seg.duration)} · ${esc(seg.season)}</div>
          </td>
          <td>
            <div>${esc(seg.audience)}</div>
            <div class="tag-line" style="margin-top:6px;">${tagsOf(seg).map(tag => `<span class="seg-tag">${esc(tag)}</span>`).join('')}</div>
          </td>
          <td>${seg.resources.map(need => {
            const found = !!pricesForResource(need, seg, AppStore.all().prices).length;
            return `<span class="resource-chip ${found ? 'available' : 'missing'}">${esc(resourceLabel(need))}</span>`;
          }).join('')}</td>
          <td>
            <span class="quote-chip ${esc(seg.quoteState.key)}">${esc(seg.quoteState.text)}</span>
            <div class="component-source">${seg.quoteState.matched}/${seg.quoteState.total} 项资源已匹配</div>
          </td>
          <td><div class="component-source">${esc(seg.source || '未标注来源')}</div></td>
          <td>
            <div class="action-stack">
              <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();viewComponent('${seg.id}')">查看</button>
              ${seg.status === 'review' ? `<button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();approveComponent('${seg.id}')">入库</button>` : ''}
              <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();openComponentEditor('${seg.id}')">编辑</button>
              <button class="btn btn-sm btn-ghost" style="color:var(--danger)" onclick="event.stopPropagation();removeComponent('${seg.id}')">${seg.status === 'review' ? '拒绝' : '删除'}</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function referencedPlans(seg) {
      return AppStore.all().plans.filter(plan => {
        const route = (plan.route || []).join(' ');
        const itinerary = (plan.itinerary || []).map(day => day.join(' ')).join(' ');
        return (route.includes(seg.from) && route.includes(seg.to)) || itinerary.includes(seg.from) || itinerary.includes(seg.to);
      });
    }

    function resourceRows(seg) {
      const quote = AppStore.buildQuoteForComponent(seg.id || seg, { people: 18 });
      return quote.lines.map(line => {
        const matches = line.price ? [line.price] : pricesForResource(line.need, seg, AppStore.all().prices);
        return `
          <div class="resource-row">
            <strong>${esc(resourceLabel(line.need))}</strong>
            <span>${matches.length ? `报价口径 ${esc(line.quoteQuantity + line.quoteUnit)} · ${esc(line.detail)}，小计 ${AppStore.money(line.amount)}` : '暂无可用价格，需要价格库补价'}</span>
            <span class="resource-chip ${line.matched ? 'available' : 'missing'}">${esc(line.status)}</span>
          </div>
        `;
      }).join('');
    }

    function priceOptionHtml(selectedId = '') {
      const options = AppStore.all().prices.map(price => {
        const label = `${price.category} · ${price.city} · ${price.name} ${AppStore.money(price.price)}/${price.unit}`;
        return `<option value="${esc(price.id)}" ${price.id === selectedId ? 'selected' : ''}>${esc(label)}</option>`;
      }).join('');
      return `<option value="">不指定，按品类和城市自动匹配</option>${options}`;
    }

    function needRowHtml(need = {}, index = 0) {
      const resourceOptions = ['机票','酒店','司导','专车','会议室','晚宴','保险','商务餐饮包','门票/活动','区间交通','餐食','用车'];
      const statusOptions = ['协议价','实时','待确认','估算',''];
      const resource = need.resource || '酒店';
      return `
        <div class="need-editor-row">
          <select class="form-select need-resource">
            ${resourceOptions.map(item => `<option ${item === resource ? 'selected' : ''}>${esc(item)}</option>`).join('')}
          </select>
          <input class="form-input need-city" value="${esc(need.city || '')}" placeholder="东京">
          <div class="need-inline">
            <input class="form-input need-quantity" type="number" min="0" step="0.5" value="${esc(need.quantity || 1)}">
            <input class="form-input need-unit" value="${esc(need.unit || '项')}" placeholder="晚">
          </div>
          <div class="need-inline">
            <input class="form-input need-pricing-quantity" type="number" min="0" step="0.5" value="${esc(need.pricingQuantity || need.quantity || 1)}">
            <input class="form-input need-pricing-unit" value="${esc(need.pricingUnit || need.unit || '项')}" placeholder="间夜">
          </div>
          <select class="form-select need-price-id">${priceOptionHtml(need.priceId || '')}</select>
          <div class="need-inline">
            <input class="form-input need-quote-group" value="${esc(need.quoteGroup || need.label || resource)}" placeholder="报价分组">
            <select class="form-select need-status">
              ${statusOptions.map(item => `<option value="${esc(item)}" ${item === (need.status || '') ? 'selected' : ''}>${esc(item || '自动')}</option>`).join('')}
            </select>
          </div>
          <button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="removeNeedRow(this)">删除</button>
          <input type="hidden" class="need-key" value="${esc(need.key || 'need-' + index)}">
          <input type="hidden" class="need-label" value="${esc(need.label || resource)}">
          <input type="hidden" class="need-adjustment" value="${esc(need.adjustment || 0)}">
          <input type="hidden" class="need-adjustment-label" value="${esc(need.adjustmentLabel || '')}">
          <input type="hidden" class="need-detail-label" value="${esc(need.detailLabel || '')}">
        </div>
      `;
    }

    function defaultNeedRows(seg) {
      if (seg?.resources?.length) return seg.resources;
      return [
        { key: 'hotel', resource: '酒店', category: '酒店', city: '', quantity: 1, unit: '晚', pricingQuantity: 1, pricingUnit: '间夜', quoteGroup: '酒店', status: '协议价' }
      ];
    }

    function addNeedRow(need = {}) {
      const body = document.getElementById('needEditorBody');
      if (!body) return;
      body.insertAdjacentHTML('beforeend', needRowHtml(need, body.querySelectorAll('.need-editor-row').length));
    }

    function removeNeedRow(button) {
      const body = document.getElementById('needEditorBody');
      button.closest('.need-editor-row')?.remove();
      if (body && !body.querySelector('.need-editor-row')) addNeedRow();
    }

    function collectNeedRows() {
      return Array.from(document.querySelectorAll('#needEditorBody .need-editor-row')).map((row, index) => {
        const resource = row.querySelector('.need-resource').value.trim();
        const quantity = Number(row.querySelector('.need-quantity').value || 1);
        const unit = row.querySelector('.need-unit').value.trim() || '项';
        const pricingQuantity = Number(row.querySelector('.need-pricing-quantity').value || quantity || 1);
        const pricingUnit = row.querySelector('.need-pricing-unit').value.trim() || unit;
        const quoteGroup = row.querySelector('.need-quote-group').value.trim() || resource;
        const status = row.querySelector('.need-status').value;
        const detailLabel = row.querySelector('.need-detail-label').value.trim() || `${resource}${quantity}${unit}`;
        return {
          key: row.querySelector('.need-key').value.trim() || `${resource}-${index}`,
          resource,
          category: AppStore.categoryForRequirement(resource),
          city: row.querySelector('.need-city').value.trim(),
          label: row.querySelector('.need-label').value.trim() || resource,
          quoteGroup,
          quantity,
          unit,
          pricingQuantity,
          pricingUnit,
          priceId: row.querySelector('.need-price-id').value,
          status,
          adjustment: Number(row.querySelector('.need-adjustment').value || 0),
          adjustmentLabel: row.querySelector('.need-adjustment-label').value.trim(),
          detailLabel
        };
      }).filter(need => need.resource);
    }

    function operationNotes(seg, state) {
      if (state.key === 'ready') return `该组件已完成资源匹配，可直接生成报价；当前模拟报价为 ${AppStore.money(state.totalAmount || 0)}，其中待确认项仍需供应商复核。`;
      if (state.key === 'review') return '该组件来自上传文件解析，入库前需确认起止地、适合客群、资源需求和原文证据。';
      return `该组件暂不能直接报价，缺少：${state.missing.map(need => resourceLabel(need, false)).join('、')}。建议先在资源成本库补齐价格。`;
    }

    function viewComponent(id) {
      const seg = normalizedComponents().find(item => item.id === id);
      if (!seg) return;
      const refs = referencedPlans(seg);
      const refsHtml = refs.length
        ? refs.map(plan => `<span class="badge badge-primary" style="margin-right:6px;margin-bottom:6px;">${esc(plan.title)}</span>`).join('')
        : '<span style="color:var(--text-muted);">暂无方案引用</span>';

      showDetailModal(`${seg.from} → ${seg.to}`, `
        <div class="detail-grid">
          <div class="detail-item"><span>组件类型</span><strong>${esc(seg.type)}</strong></div>
          <div class="detail-item"><span>建议时长</span><strong>${esc(seg.duration)}</strong></div>
          <div class="detail-item"><span>适合客群</span><strong>${esc(seg.audience)}</strong></div>
          <div class="detail-item"><span>可报价状态</span><strong>${esc(seg.quoteState.text)}</strong></div>
        </div>
        <h4 style="margin-bottom:8px;">客户版文案</h4>
        <p style="line-height:1.8;color:var(--text-secondary);margin-bottom:16px;">${esc(seg.desc)}</p>
        <h4 style="margin-bottom:8px;">所需报价资源</h4>
        <div class="resource-matrix">${resourceRows(seg)}</div>
        <h4 style="margin-bottom:8px;">计调备注</h4>
        <div class="panel-note warning" style="margin-bottom:16px;">${esc(operationNotes(seg, seg.quoteState))}</div>
        <h4 style="margin-bottom:8px;">原文证据</h4>
        <div class="panel-note" style="margin-bottom:16px;">${esc(seg.original || seg.source || '暂无原文证据')}</div>
        <h4 style="margin-bottom:8px;">方案引用</h4>
        <div>${refsHtml}</div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">关闭</button>
        <button class="btn btn-secondary" onclick="openComponentEditor('${seg.id}')">编辑组件</button>
        ${seg.status === 'review' ? `<button class="btn btn-primary" onclick="approveComponent('${seg.id}');closeModal('globalDetailModal')">确认入库</button>` : `<button class="btn btn-primary" onclick="goPricing('${seg.id}')">补齐价格</button>`}
      `);
    }

    function openComponentEditor(id = '') {
      const seg = id ? normalizedComponents().find(item => item.id === id) : null;
      const needRows = defaultNeedRows(seg);
      showDetailModal(seg ? '编辑行程组件' : '添加行程组件', `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group"><label class="form-label">起点</label><input class="form-input" id="editFrom" value="${esc(seg?.from || '')}" placeholder="如：东京"></div>
          <div class="form-group"><label class="form-label">终点</label><input class="form-input" id="editTo" value="${esc(seg?.to || '')}" placeholder="如：箱根"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="form-group"><label class="form-label">类型</label><input class="form-input" id="editType" value="${esc(seg?.type || '')}" placeholder="如：商务/团建组件"></div>
          <div class="form-group"><label class="form-label">时长</label><input class="form-input" id="editDuration" value="${esc(seg?.duration || '')}" placeholder="如：2天1晚"></div>
          <div class="form-group"><label class="form-label">客群</label><input class="form-input" id="editAudience" value="${esc(seg?.audience || '')}" placeholder="如：商务/团建"></div>
        </div>
        <div class="form-group"><label class="form-label">客户版文案</label><textarea class="form-textarea" id="editDesc" rows="4">${esc(seg?.desc || '')}</textarea></div>
        <div class="form-group">
          <label class="form-label">资源需求定义</label>
          <div class="need-editor" id="needEditor">
            <div class="need-editor-head">
              <span>资源</span><span>城市/区间</span><span>业务需求</span><span>报价口径</span><span>匹配价格</span><span>报价分组/状态</span><span>操作</span>
            </div>
            <div id="needEditorBody">${needRows.map((need, index) => needRowHtml(need, index)).join('')}</div>
          </div>
          <button class="btn btn-secondary btn-sm" type="button" onclick="addNeedRow()">添加资源需求</button>
        </div>
        <div class="form-group"><label class="form-label">标签（逗号分隔）</label><input class="form-input" id="editTags" value="${esc(tagsOf(seg || {}).join(','))}" placeholder="商务,温泉,团建"></div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="saveComponent('${esc(id)}')">保存</button>
      `);
    }

    function saveComponent(id = '') {
      const from = document.getElementById('editFrom').value.trim();
      const to = document.getElementById('editTo').value.trim();
      const desc = document.getElementById('editDesc').value.trim();
      if (!from || !to || !desc) {
        showToast('请填写起点、终点和客户版文案', 'warning');
        return;
      }
      const patch = {
        from,
        to,
        componentType: document.getElementById('editType').value.trim() || '行程组件',
        duration: document.getElementById('editDuration').value.trim() || '1天',
        audience: document.getElementById('editAudience').value.trim() || '不限人群',
        desc,
        requiredResources: collectNeedRows(),
        tags: document.getElementById('editTags').value.split(',').map(item => item.trim()).filter(Boolean),
        region: /巴黎|尼斯|苏黎世|卢塞恩|因特拉肯|蒙特勒/.test(from + to) ? 'europe' : 'asia',
        transport: '组件',
        season: '全年',
        source: '手动维护 · ' + AppStore.todayText(),
        original: '计调人工维护组件'
      };
      if (id) {
        AppStore.updateSegment(id, patch);
      } else {
        AppStore.addSegment({ ...patch, status: 'approved' });
      }
      closeModal('globalDetailModal');
      showToast('行程组件已保存', 'success');
      renderComponents();
    }

    function approveComponent(id) {
      AppStore.approveSegment(id);
      showToast('组件已确认入库', 'success');
      renderComponents();
    }

    function removeComponent(id) {
      const seg = AppStore.all().segments.find(item => item.id === id);
      if (!seg) return;
      confirmAction(`${seg.status === 'review' ? '拒绝' : '删除'}组件：${seg.from} → ${seg.to}？`, () => {
        if (seg.status === 'review') {
          AppStore.rejectSegment(id);
          showToast('已拒绝该组件', 'warning');
        } else {
          AppStore.deleteSegment(id);
          showToast('组件已删除', 'success');
        }
        renderComponents();
      });
    }

    function goPricing(id) {
      sessionStorage.setItem('pricingFromComponentId', id);
      location.href = 'pricing.html';
    }

    function showUploadRule() {
      showDetailModal('上传文件拆解规则', `
        <div class="resource-matrix">
          ${[
            ['线路方案', '拆成城市衔接、住宿段、景点体验、自由活动等行程组件', '入组件库'],
            ['地接报价单', '拆成用车、司导、酒店、餐、门票等资源成本', '入价格库'],
            ['酒店协议价', '拆房型、餐标、有效期、取消规则、淡旺季', '入价格库'],
            ['客户需求文档', '拆人数、预算、目的地、偏好、禁忌和确认状态', '入对话上下文']
          ].map(row => `
            <div class="resource-row">
              <strong>${esc(row[0])}</strong>
              <span>${esc(row[1])}</span>
              <span class="resource-chip available">${esc(row[2])}</span>
            </div>
          `).join('')}
        </div>
        <div class="panel-note warning">判断标准：不能参与报价的内容只能作为文案素材；只有声明了所需资源，并能匹配价格库的组件，才能自动进入方案报价。</div>
      `);
    }

    document.querySelectorAll('.filter-bar .form-input, .filter-bar .form-select').forEach(el => {
      el.addEventListener('input', renderComponents);
      el.addEventListener('change', renderComponents);
    });

    renderComponents();
  </script>
</body>
</html>
