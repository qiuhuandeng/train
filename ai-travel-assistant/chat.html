<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI对话 - AI智能计调助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .chat-layout {
      padding-top: var(--nav-height);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* 左侧栏 - 对话列表 */
    .chat-sidebar {
      width: 280px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header .btn {
      width: 100%;
    }

    .sidebar-search {
      padding: 12px 16px;
    }

    .sidebar-search input {
      width: 100%;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      outline: none;
      background: var(--bg-soft);
    }

    .sidebar-search input:focus {
      border-color: var(--primary);
      background: white;
    }

    .conversation-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .conversation-item {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      position: relative;
    }

    .conversation-item:hover {
      background: var(--bg-hover);
    }

    .conversation-item.active {
      background: var(--primary-bg);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .conversation-item .conv-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 54px;
    }

    .conversation-item .conv-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-item .conv-time {
      position: absolute;
      right: 16px;
      top: 14px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .context-menu {
      position: fixed;
      min-width: 148px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 6px;
      z-index: 2500;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu button {
      width: 100%;
      border: none;
      background: transparent;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      text-align: left;
      font-family: var(--font-family);
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
    }

    .context-menu button:hover {
      background: var(--bg-hover);
    }

    .context-menu button.danger {
      color: var(--danger);
    }

    /* 中间主对话区 */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header .chat-title {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .chat-status {
      font-size: 12px;
      color: var(--text-muted);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 消息气泡 */
    .message {
      display: flex;
      gap: 12px;
      max-width: 75%;
      animation: slideUp 0.3s ease;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.ai .msg-avatar {
      background: var(--primary);
      color: white;
    }

    .message.user .msg-avatar {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .message .msg-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message .msg-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.7;
    }

    .message.ai .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .message.user .msg-bubble {
      background: var(--primary);
      color: white;
    }

    .message .msg-time {
      font-size: 11px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .message.user .msg-time {
      text-align: right;
    }

    /* AI追问快捷按钮 */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-reply-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: var(--bg-card);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      color: var(--text-primary);
    }

    .quick-reply-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-bg);
    }

    /* 线路推荐卡片 */
    .route-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-top: 8px;
      max-width: 480px;
      box-shadow: var(--shadow-sm);
    }

    .route-card .route-title {
      font-size: 15px;
      font-weight: 760;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .route-card .route-day {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    .route-card .route-day:last-of-type {
      border-bottom: none;
    }

    .route-card .day-num {
      background: var(--primary-bg);
      color: var(--primary);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .route-card .route-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    /* 报价卡片 */
    .quote-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-top: 8px;
      max-width: 420px;
      box-shadow: var(--shadow-sm);
    }

    .quote-card .quote-title {
      font-size: 14px;
      font-weight: 760;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quote-card table {
      width: 100%;
      font-size: 13px;
    }

    .quote-card table td {
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .quote-card .quote-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
      font-weight: 780;
      font-size: 16px;
    }

    .compare-card,
    .task-card,
    .doc-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-top: 8px;
      max-width: 520px;
      box-shadow: var(--shadow-sm);
    }

    .compare-card .compare-title,
    .task-card .task-title,
    .doc-card .doc-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-option {
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    .compare-option:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .compare-option strong {
      display: block;
      margin-bottom: 4px;
    }

    .compare-meta,
    .task-meta,
    .doc-meta {
      color: var(--text-muted);
      font-size: 12px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
    }

    .task-list span {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--bg-sidebar);
    }

    /* 系统消息 */
    .system-message {
      align-self: center;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 6px 16px;
      background: var(--bg-soft);
      border: 1px solid var(--border-light);
      border-radius: 99px;
    }

    /* 输入加载动画 */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 0;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    /* 输入区域 */
    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    .input-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .toolbar-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .toolbar-btn .icon-line,
    .send-btn .icon-line,
    .command-item .icon-line {
      width: 18px;
      height: 18px;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .input-wrapper textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-family: var(--font-family);
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.5;
      background: var(--bg-card);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .input-wrapper textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.1);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: var(--radius-lg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.12);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* 指令菜单 */
    .command-menu {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: 8px;
      display: none;
      overflow: hidden;
    }

    .command-menu.show {
      display: block;
      animation: slideUp 0.2s ease;
    }

    .command-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      transition: background 0.15s ease;
    }

    .command-item:hover {
      background: var(--bg-hover);
    }

    .command-item .cmd-name {
      font-weight: 600;
      color: var(--primary);
    }

    .command-item .cmd-desc {
      color: var(--text-muted);
    }

    /* 右侧面板 */
    .chat-panel {
      width: 320px;
      background: var(--bg-soft);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .panel-section-title {
      font-size: 12px;
      font-weight: 760;
      color: var(--text-muted);
      text-transform: none;
      letter-spacing: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .requirement-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .requirement-item .req-label {
      color: var(--text-secondary);
    }

    .requirement-item .req-value {
      font-weight: 500;
    }

    .requirement-item .req-value.unconfirmed {
      color: var(--text-muted);
      font-style: italic;
    }

    .panel-note {
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--bg-soft);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.6;
    }

    .panel-note.warning {
      background: var(--warning-bg);
      color: #92400E;
    }

    .context-empty {
      padding: 16px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-light);
    }

    .timeline {
      position: relative;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding: 8px 0;
      font-size: 12px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -17px;
      top: 13px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      border: 2px solid white;
      box-shadow: 0 0 0 2px var(--primary-bg);
    }

    .timeline-item .tl-day {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
    }

    .timeline-item .tl-desc {
      color: var(--text-secondary);
    }

    .price-summary {
      font-size: 13px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .price-row:last-of-type {
      border-bottom: none;
    }

    .price-row .price-label {
      color: var(--text-secondary);
    }

    .price-row .price-source {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .price-row .source-local {
      background: var(--success-bg);
      color: var(--success);
    }

    .price-row .source-api {
      background: var(--info-bg);
      color: var(--info);
    }

    .price-row .source-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      margin-top: 8px;
      border-top: 2px solid var(--border);
      font-weight: 700;
      font-size: 15px;
    }

    .panel-actions {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-actions .btn {
      width: 100%;
      justify-content: center;
    }

    .timeline-item[draggable="true"] {
      cursor: grab;
      border-radius: var(--radius-sm);
    }

    .timeline-item.drag-over {
      background: var(--primary-bg);
    }

    .timeline-item.dragging {
      opacity: 0.45;
    }

    @media (max-width: 768px) {
      .chat-layout {
        display: flex;
        width: 100vw;
      }

      .chat-sidebar,
      .chat-panel {
        display: none;
      }

      .chat-main {
        width: 100%;
        min-width: 0;
      }

      .chat-header {
        padding: 10px 12px;
      }

      .chat-header .chat-title {
        font-size: 14px;
      }

      .chat-header .chat-status {
        font-size: 11px;
      }

      .chat-header > div:last-child {
        display: none !important;
      }

      .chat-messages {
        padding: 12px;
        gap: 14px;
      }

      .message {
        max-width: 94%;
      }

      .route-card,
      .quote-card,
      .compare-card,
      .task-card,
      .doc-card {
        max-width: 100%;
      }

      .chat-input-area {
        padding: 10px 12px;
      }

      .input-toolbar span:last-child {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="chat-layout">
    <!-- 左侧对话列表 -->
    <div class="chat-sidebar">
      <div class="sidebar-header">
        <button class="btn btn-primary" onclick="newConversation()">
          ＋ 新建对话
        </button>
      </div>
      <div class="sidebar-search">
        <input type="text" id="conversationSearch" placeholder="搜索客户、目的地..." oninput="renderConversationList()">
      </div>
      <ul class="conversation-list" id="conversationList"></ul>
    </div>

    <!-- 中间对话区 -->
    <div class="chat-main">
      <div class="chat-header">
        <div>
          <div class="chat-title" id="chatTitle"></div>
          <div class="chat-status" id="chatStatus"></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-secondary" onclick="exportConversation()">导出对话</button>
          <button class="btn btn-sm btn-ghost" onclick="showConversationMenu(event)">⋯</button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <!-- 输入区 -->
      <div class="chat-input-area">
        <div class="input-toolbar">
          <button class="toolbar-btn" title="上传文件" onclick="location.href='upload.html'"><span data-icon="paperclip"></span></button>
          <button class="toolbar-btn" title="上传图片" onclick="mockAttachImage()"><span data-icon="image"></span></button>
          <button class="toolbar-btn" title="语音输入" onclick="mockVoiceInput()"><span data-icon="mic"></span></button>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--text-muted);">输入 / 查看可用指令</span>
        </div>
        <div class="input-wrapper" style="position:relative;">
          <div class="command-menu" id="commandMenu">
            <div class="command-item" onclick="insertCommand('/上传线路')">
              <span data-icon="file"></span>
              <span class="cmd-name">/上传线路</span>
              <span class="cmd-desc">上传线路文件并解析入库</span>
            </div>
            <div class="command-item" onclick="insertCommand('/上价格')">
              <span data-icon="coins"></span>
              <span class="cmd-name">/上价格</span>
              <span class="cmd-desc">上传价格/库存表</span>
            </div>
            <div class="command-item" onclick="insertCommand('/生成海报')">
              <span data-icon="image"></span>
              <span class="cmd-name">/生成海报</span>
              <span class="cmd-desc">基于当前方案生成海报</span>
            </div>
            <div class="command-item" onclick="insertCommand('/生成PDF')">
              <span data-icon="clipboard"></span>
              <span class="cmd-name">/生成PDF</span>
              <span class="cmd-desc">生成行程单PDF文档</span>
            </div>
            <div class="command-item" onclick="insertCommand('/报价')">
              <span data-icon="calculator"></span>
              <span class="cmd-name">/报价</span>
              <span class="cmd-desc">对当前方案生成详细报价</span>
            </div>
          </div>
          <textarea id="chatInput" placeholder="描述客户需求，或输入 / 使用指令..." rows="1" onkeydown="handleKeydown(event)" oninput="handleInput(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()" id="sendBtn"><span data-icon="send"></span></button>
        </div>
      </div>
    </div>

    <!-- 右侧面板 -->
    <div class="chat-panel" id="contextPanel"></div>
  </div>

  <div class="context-menu" id="conversationMenu"></div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderNavbar('chat');

    const LEGACY_CHAT_KEY = 'aiTravelAssistant.chat.v2';
    const LEGACY_CHAT_VERSION = 'multi-stage-20260729';
    const chatInput = document.getElementById('chatInput');
    let conversations = simplifyConversations(loadConversations());
    const requestedConversationId = sessionStorage.getItem('openConversationId');
    let activeConversationId = conversations.some(item => item.id === requestedConversationId) ? requestedConversationId : 'new-intake';
    sessionStorage.removeItem('openConversationId');

    function parseMoney(value) {
      const match = String(value || '').match(/[\d,]+(?:\.\d+)?/);
      const num = match ? match[0].replace(/,/g, '') : '';
      return Number(num || 0);
    }

    function routeFromConversation(conv) {
      const values = (conv.requirements || []).find(item => item.label === '目的地')?.value || '';
      const from = (conv.requirements || []).find(item => item.label === '出发地')?.value || '出发地';
      if (conv.id === 'new-intake') return ['上海', '东京', '箱根', '上海'];
      if (conv.id === 'zhang-family') return ['上海', '苏黎世', '卢塞恩', '因特拉肯', '蒙特勒', '巴黎', '上海'];
      if (conv.id === 'li-honeymoon') return ['广州', '马累', '莉莉岛', '广州'];
      if (conv.id === 'wang-business') return ['北京', '东京', '箱根', '北京'];
      if (conv.id === 'zhao-rework') return ['杭州', '新加坡', '圣淘沙', '杭州'];
      if (conv.id === 'thai-done') return ['深圳', '普吉岛', '深圳'];
      return [from, values || '目的地', from];
    }

    function syncConversationToPlan(conv, documentName, versionReason) {
      if (!window.AppStore || !conv.quote) return null;
      const data = AppStore.all();
      const existing = data.plans.find(item => item.conversationId === conv.id);
      const requirements = Object.fromEntries((conv.requirements || []).map(item => [item.label, item.value]));
      const itinerary = (conv.itinerary || []).map(item => [item[0], item[1]]);
      const quoteItems = (conv.quote.items || []).map(item => [item[0], parseMoney(item[1]), item[2]]);
      const patch = {
        conversationId: conv.id,
        title: conv.title.replace(' - 未命名', ''),
        route: routeFromConversation(conv),
        status: conv.status === 'done' ? 'confirmed' : (conv.status === 'archived' ? 'archived' : 'pending'),
        statusText: conv.status === 'done' ? '已确认' : (conv.status === 'archived' ? '已归档' : '待客户确认'),
        people: requirements['人数'] || '待确认',
        days: requirements['天数'] || '待确认',
        hotel: requirements['住宿'] || '待确认',
        total: parseMoney(conv.quote.total),
        perPerson: parseMoney(conv.quote.perPerson) || Math.round(parseMoney(conv.quote.total) / 2),
        summary: (conv.notes || [conv.statusText])[0],
        itinerary,
        quoteItems,
        documents: []
      };

      if (existing) {
        const docs = new Set(existing.documents || []);
        if (documentName) docs.add(documentName);
        patch.documents = Array.from(docs);
        const updated = AppStore.updatePlan(existing.id, patch);
        if (versionReason) {
          AppStore.capturePlanVersion(existing.id, 'V' + ((updated.versions || []).length + 1) + ' ' + versionReason, versionReason);
        }
        return updated;
      }

      if (documentName) patch.documents = [documentName];
      const created = AppStore.addPlan(patch);
      if (versionReason) {
        AppStore.capturePlanVersion(created.id, 'V' + ((created.versions || []).length + 1) + ' ' + versionReason, versionReason);
      }
      return created;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function nl2br(value) {
      return escapeHtml(value).replace(/\n/g, '<br>');
    }

      const now = new Date();
      return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    function renderConversationList() {
      const keyword = (document.getElementById('conversationSearch')?.value || '').trim().toLowerCase();
      const list = document.getElementById('conversationList');
      const filtered = conversations.filter(conv => {
        const haystack = [
          conv.title,
          conv.stage,
          conv.preview,
          ...(conv.requirements || []).map(item => item.value)
        ].join(' ').toLowerCase();
        return !keyword || haystack.includes(keyword);
      });

      if (!filtered.length) {
        list.innerHTML = '<li class="conversation-item"><div class="conv-preview">没有匹配的客户对话</div></li>';
        return;
      }

      list.innerHTML = filtered.map(conv => `
        <li class="conversation-item ${conv.id === activeConversationId ? 'active' : ''}" onclick="switchConversation('${conv.id}')" oncontextmenu="openConversationMenu(event, '${conv.id}')">

    function renderTaskCard(card) {
      return `
        <div class="task-card">
          <div class="task-title">${escapeHtml(card.title)}</div>
          <div class="task-list">
            ${(card.rows || []).map(row => `<span><strong>${escapeHtml(row[0])}</strong><em>${escapeHtml(row[1])}</em></span>`).join('')}
          </div>
        </div>
      `;
    }

    function renderDocCard(card) {
      return `
        <div class="doc-card">
          <div class="doc-title">${iconSvg('paperclip')}<span>${escapeHtml(card.title)}</span></div>
          <div class="doc-meta">${escapeHtml(card.meta)}</div>
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            ${(card.actions || ['查看']).map(action => `<button class="btn btn-sm btn-secondary" onclick="handleDocCardAction('${escapeHtml(action)}')">${escapeHtml(action)}</button>`).join('')}
          </div>
        </div>
      `;
    }

    function renderContextPanel() {
      const conv = currentConversation();
      const panel = document.getElementById('contextPanel');
      panel.innerHTML = `
        <div class="panel-section">
          <div class="panel-section-title">${iconSvg('clipboard')}<span>当前需求摘要</span></div>
          ${renderRequirements(conv.requirements)}
        </div>
        <div class="panel-section">
          <div class="panel-section-title">${iconSvg('map')}<span>${escapeHtml(conv.itineraryTitle || '线路状态')}</span></div>
          ${renderItinerary(conv.itinerary)}
        </div>
        <div class="panel-section">
          <div class="panel-section-title">${iconSvg('dollar')}<span>报价状态</span></div>
          ${renderQuoteSummary(conv.quote)}
        </div>
        <div class="panel-section">
          <div class="panel-section-title">${iconSvg('flag')}<span>跟进提醒</span></div>
          ${renderNotes(conv.notes)}
        </div>
        <div class="panel-actions">
          <button class="btn btn-primary" onclick="handlePanelAction('pdf', this)">${iconSvg('clipboard')}<span>生成行程单PDF</span></button>
          <button class="btn btn-secondary" onclick="handlePanelAction('poster', this)">${iconSvg('image')}<span>生成朋友圈海报</span></button>
          <button class="btn btn-secondary" onclick="handlePanelAction('quote', this)">${iconSvg('chart')}<span>导出报价单</span></button>
        </div>
      `;
    }

    function renderRequirements(requirements) {
      if (!requirements || !requirements.length) {
        return '<div class="context-empty">等待输入客户需求后自动提取字段</div>';
      }

      return requirements.map(item => `
        <div class="requirement-item">
          <span class="req-label">${escapeHtml(item.label)}</span>
          <span class="req-value ${item.confirmed ? '' : 'unconfirmed'}">${escapeHtml(item.value)}${item.confirmed ? '' : ' ?'}</span>
        </div>
      `).join('');
    }

    function renderItinerary(itinerary) {
      if (!itinerary || !itinerary.length) {
        return '<div class="context-empty">尚未生成线路，AI 会先追问关键信息</div>';
      }

      return `
        <div class="timeline">
          ${itinerary.map((item, index) => `
            <div class="timeline-item" draggable="true" ondragstart="startItineraryDrag(event, ${index})" ondragover="overItineraryDrag(event, ${index})" ondragleave="event.currentTarget.classList.remove('drag-over')" ondrop="dropItineraryDay(event, ${index})" ondragend="endItineraryDrag(event)">
              <div class="tl-day">${escapeHtml(item[0])}</div>
              <div class="tl-desc">${escapeHtml(item[1])}</div>
            </div>
          `).join('')}
        </div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px;">可拖拽调整顺序</div>
      `;
    }

    function renderQuoteSummary(quote) {
      if (!quote) {
        return '<div class="context-empty">报价未生成，需先确认方案或关键资源</div>';
      }

      return `
        <div class="price-summary">
          ${quote.items.map(item => `
            <div class="price-row">
              <span class="price-label">${escapeHtml(item[0])}</span>
              <span>${escapeHtml(item[1])} <span class="price-source ${sourceClass(item[3])}">${escapeHtml(item[2])}</span></span>
            </div>
          `).join('')}
          <div class="price-total">
            <span>${escapeHtml(quote.totalLabel || '预估总价')}</span>
            <span style="color:var(--primary);">${escapeHtml(quote.total)}</span>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;text-align:right;">${escapeHtml(quote.perPerson || '')}</div>
        </div>
      `;
    }

    function sourceClass(type) {
      if (type === 'api') return 'source-api';
      if (type === 'warning') return 'source-warning';
      return 'source-local';
    }

    function renderNotes(notes) {
      if (!notes || !notes.length) return '<div class="context-empty">暂无特别提醒</div>';
      return notes.map((note, index) => `<div class="panel-note ${index === 0 ? 'warning' : ''}" style="margin-bottom:8px;">${escapeHtml(note)}</div>`).join('');
    }

    let draggingItineraryIndex = null;

    function startItineraryDrag(event, index) {
      draggingItineraryIndex = index;
      event.currentTarget.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function overItineraryDrag(event, index) {
      event.preventDefault();
      if (draggingItineraryIndex === index) return;
      event.currentTarget.classList.add('drag-over');
    }

    function endItineraryDrag(event) {
      event.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.timeline-item.drag-over').forEach(item => item.classList.remove('drag-over'));
    }

    function dropItineraryDay(event, targetIndex) {
      event.preventDefault();
      document.querySelectorAll('.timeline-item.drag-over').forEach(item => item.classList.remove('drag-over'));
      if (draggingItineraryIndex === null || draggingItineraryIndex === targetIndex) return;
      const conv = currentConversation();
      const [moved] = conv.itinerary.splice(draggingItineraryIndex, 1);
      conv.itinerary.splice(targetIndex, 0, moved);
      draggingItineraryIndex = null;
      conv.stage = '持续修改中';
      conv.stageClass = 'rework';
      conv.status = 'rework';
      conv.statusText = '行程顺序已调整 · 待确认新版';
      conv.notes = ['已通过拖拽调整行程顺序，请重新检查交通衔接和报价。', ...(conv.notes || []).slice(0, 1)];
      syncConversationToPlan(conv, null, '拖拽调整行程');
      renderAll();
      showToast('行程顺序已更新', 'success');
    }

    function switchConversation(id) {
      activeConversationId = id;
      document.getElementById('commandMenu').classList.remove('show');
      renderAll();
    }

    function handleInput(e) {
      const val = e.target.value;
      const menu = document.getElementById('commandMenu');
      if (val.startsWith('/')) {
        menu.classList.add('show');
      } else {
        menu.classList.remove('show');
      }
    }

    function insertCommand(cmd) {
      chatInput.value = cmd + ' ';
      chatInput.focus();
      document.getElementById('commandMenu').classList.remove('show');
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const input = chatInput.value.trim();
      if (!input) return;

      addMessage({ role: 'user', text: input, time: nowTime() });
      chatInput.value = '';
      chatInput.style.height = 'auto';
      document.getElementById('commandMenu').classList.remove('show');

      if (handleCommand(input)) return;

      showTyping();
      setTimeout(() => {
        removeTyping();
        addScenarioReply(input);
      }, 900);
    }

    function sendQuickReply(text) {
      chatInput.value = text;
      sendMessage();
    }

    function addMessage(message) {
      const conv = currentConversation();
      conv.messages.push(message);
      if (message.role === 'user') {
        conv.preview = message.text;
        conv.time = '刚刚';
      } else if (message.role === 'ai') {
        conv.preview = 'AI：' + message.text.slice(0, 24);
        conv.time = '刚刚';
      }
      renderAll();
    }

    function showTyping() {
      const messages = document.getElementById('chatMessages');
      messages.insertAdjacentHTML('beforeend', `
        <div class="message ai" id="typingMsg">
          <div class="msg-avatar">AI</div>
          <div class="msg-content">
            <div class="msg-bubble">
              <div class="typing-indicator"><span></span><span></span><span></span></div>
            </div>
          </div>
        </div>
      `);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingMsg');
      if (typing) typing.remove();
    }

    function handleCommand(input) {
      const command = input.split(/\s+/)[0];
      if (!command.startsWith('/')) return false;

      showTyping();
      setTimeout(() => {
        removeTyping();
        if (command === '/上传线路') {
          addMessage({
            role: 'ai',
            time: nowTime(),
            text: '已切换到线路文件处理流程。您可以去文件管理页上传 PDF，解析完成后我会把待审核切段同步到知识库。',
            cards: [{ type: 'task', title: '线路上传流程', rows: [['上传文件', 'PDF/Word/图片均可'], ['解析结果', '进入待审核队列'], ['入库后', '可直接用于线路推荐']] }]
          });
        } else if (command === '/上价格') {
          addMessage({ role: 'ai', time: nowTime(), text: '已准备价格导入流程。建议上传 Excel/CSV 后先做字段映射，再统一设置有效期。', quickReplies: ['进入价格库', '查看即将过期价格'] });
        } else if (command === '/报价') {
          generateQuote();
        } else if (command === '/生成PDF') {
          handlePanelAction('pdf');
        } else if (command === '/生成海报') {
          handlePanelAction('poster');
        } else {
          addMessage({ role: 'ai', time: nowTime(), text: '这个指令暂未配置，我可以先按普通需求继续处理。' });
        }
      }, 700);
      return true;
    }

    function addScenarioReply(input) {
      const conv = currentConversation();
      const text = input.toLowerCase();

      if (conv.status === 'draft') {
        hydrateDraftConversation(conv, input);
        addMessage({
          role: 'ai',
          time: nowTime(),
          text: '我已开始提取客户需求。现在还缺少出发城市、人数、预算和住宿偏好，确认后我就能组合第一版线路。',
          quickReplies: ['上海出发', '2大1小', '预算人均2万', '四星酒店即可']
        });
        return;
      }

      if (text.includes('确认') && conv.quote) {
        confirmQuote();
        return;
      }

      if (text.includes('报价') || text.includes('价格') || text.includes('预算')) {
        generateQuote();
        return;
      }

      if (text.includes('换') || text.includes('调整') || text.includes('修改') || text.includes('不想')) {
        conv.stage = '持续修改中';
        conv.stageClass = 'rework';
        conv.status = 'rework';
        conv.statusText = '客户提出新变更 · AI 正在追踪版本差异';
        conv.notes = ['刚收到新的修改需求，建议先判断是否影响报价和资源库存。', ...(conv.notes || []).slice(0, 1)];
        syncConversationToPlan(conv, null, '客户变更');
        addMessage({
          role: 'ai',
          time: nowTime(),
          text: '收到，我会把这次变更记录到当前方案版本里，并检查它对行程节奏、报价和库存的影响。',
          cards: [{ type: 'task', title: '变更影响检查', rows: [['行程', '检查是否需要调整前后天顺序'], ['报价', conv.quote ? '需要刷新受影响项目' : '暂未生成报价'], ['客户沟通', '建议标注本次修改原因']] }]
        });
        return;
      }

      if (conv.id === 'li-honeymoon') {
        addMessage({
          role: 'ai',
          time: nowTime(),
          text: '马代这单我建议继续围绕“莉莉岛主推 + 奥臻备选”推进。当前关键点是房型库存和水飞时间，一旦确认就能出正式报价。',
          quickReplies: ['按 2沙4水询价', '全程水屋询价', '生成客户版对比']
        });
        return;
      }

      if (conv.status === 'archived') {
        addMessage({
          role: 'ai',
          time: nowTime(),
          text: '这是已归档方案。我可以帮您复制成新方案模板，或者查看归档文件，不会直接改动原始归档记录。',
          quickReplies: ['复制为新方案', '查看归档文件']
        });
        return;
      }

      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '收到，我已把这条信息加入当前客户上下文。下一步可以继续补充需求、调整行程，或直接让我生成报价。',
        quickReplies: ['生成报价', '调整行程', '生成行程单PDF']
      });
    }

    function hydrateDraftConversation(conv, input) {
      conv.title = input.includes('马代') || input.includes('马尔代夫') ? '新客户 - 马代咨询' : '新客户';
      conv.stage = '需求收集中';
      conv.stageClass = 'active';
      conv.status = 'active';
      conv.statusText = '新建对话 · 正在提取客户画像';
      conv.requirements = [
        { label: '客户', value: '新客户', confirmed: false },
        { label: '人数', value: input.match(/\d+人/)?.[0] || '待确认', confirmed: /\d+人/.test(input) },
        { label: '出发地', value: input.includes('上海') ? '上海' : '待确认', confirmed: input.includes('上海') },
        { label: '目的地', value: detectDestination(input), confirmed: detectDestination(input) !== '待确认' },
        { label: '天数', value: input.match(/\d+天/)?.[0] || '待确认', confirmed: /\d+天/.test(input) },
        { label: '预算', value: input.includes('预算') ? '已提及，待量化' : '待确认', confirmed: false },
        { label: '偏好', value: input.includes('亲子') ? '亲子友好' : '待确认', confirmed: input.includes('亲子') }
      ];
    }

    function detectDestination(input) {
      if (input.includes('瑞士') || input.includes('法国')) return '瑞士 + 法国';
      if (input.includes('日本')) return '日本';
      if (input.includes('新加坡')) return '新加坡';
      if (input.includes('马代') || input.includes('马尔代夫')) return '马尔代夫';
      if (input.includes('泰国') || input.includes('普吉')) return '泰国普吉岛';
      return '待确认';
    }

    function selectPlan(plan) {
      const conv = currentConversation();
      conv.stage = '报价待生成';
      conv.stageClass = 'pending';
      conv.status = 'pending';
      conv.statusText = '方案已选定 · 等待生成或刷新报价';
      conv.itineraryTitle = '已选线路（方案' + plan + '）';
      conv.notes = ['已选择方案' + plan + '，建议先刷新核心资源价格再发给客户。', ...(conv.notes || []).slice(0, 1)];
      addMessage({
        role: 'system',
        text: '已选择方案' + plan + '，右侧线路状态已更新'
      });
      showToast('已选择方案' + plan + '，可继续生成报价', 'success');
    }

    function selectHotelOption(index) {
      const conv = currentConversation();
      const hotel = index === 0 ? '莉莉岛 Lily Beach' : '奥臻岛 OZEN Life Maadhoo';
      conv.requirements = (conv.requirements || []).map(item => {
        if (item.label === '住宿') return { ...item, value: hotel + '，房型待确认', confirmed: false };
        return item;
      });
      conv.notes = ['已选择' + hotel + '作为主推酒店，下一步确认房型库存。', ...(conv.notes || []).slice(0, 1)];
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '已将“' + hotel + '”设为主推。现在还需要确认 2沙4水还是全程水屋，确认后可生成正式报价。',
        quickReplies: ['按 2沙4水报价', '全程水屋报价']
      });
    }

    function generateQuote() {
      const conv = currentConversation();
      if (!conv.itinerary || !conv.itinerary.length) {
        addMessage({ role: 'ai', time: nowTime(), text: '现在还不能报价，因为方案还没有成型。请先补齐目的地、天数、人数和住宿要求。', quickReplies: ['补充人数', '补充预算', '补充出发城市'] });
        return;
      }

      if (conv.id === 'new-intake') {
        conv.quote = conversationQuoteFromEngine(AppStore.japanBusinessQuote());
      } else if (!conv.quote) {
        conv.quote = {
          title: '初版预估报价',
          totalLabel: '预估总价',
          total: conv.id === 'li-honeymoon' ? '¥43,800 起' : '待核价',
          perPerson: conv.id === 'li-honeymoon' ? '2人蜜月价 · 房型库存待确认' : '供应商资源待确认',
          items: conv.id === 'li-honeymoon'
            ? [['国际机票', '¥9,600', '实时', 'api'], ['莉莉岛套餐', '¥31,800', '待确认', 'warning'], ['水飞交通', '¥2,400', '估算', 'warning']]
            : [['机票', '待查询', '实时', 'api'], ['酒店', '待匹配', '待确认', 'warning'], ['地接', '待核价', '待确认', 'warning']]
        };
      }

      conv.stage = '报价待确认';
      conv.stageClass = 'pending';
      conv.status = 'pending';
      conv.statusText = '报价已生成 · 等待客户确认';
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '已根据当前方案生成报价。标记为“待确认”的资源建议在发送客户前再核一次库存和有效期。',
        cards: [{
          type: 'quote',
          title: conv.quote.title,
          total: conv.quote.total,
          note: conv.quote.perPerson,
          items: conv.quote.items.map(item => [item[0], item[1], item[2]])
        }]
      });
    }

    function confirmQuote() {
      const conv = currentConversation();
      if (!conv.quote) {
        showToast('当前还没有报价可确认', 'warning');
        return;
      }

      conv.stage = '报价已确认';
      conv.stageClass = 'done';
      conv.status = 'done';
      conv.statusText = '客户已确认报价 · 可生成正式文档';
      conv.preview = '报价已确认，可生成行程单';
      conv.notes = ['报价已确认，下一步建议生成客户版行程单并保存到方案管理。', ...(conv.notes || []).slice(0, 1)];
      syncConversationToPlan(conv, null, '报价确认');
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '报价已确认。我已把当前方案标记为“可出文档”，可以生成行程单 PDF、报价单或海报。',
        cards: [{ type: 'doc', title: '可生成文档', meta: '客户版行程单 PDF · 内部报价单 · 朋友圈海报', actions: ['生成行程单PDF', '生成报价单', '生成海报'] }]
      });
      showToast('报价已确认，可以生成文档', 'success');
    }

    function newConversation() {
      const fresh = getIntakeConversation();
      const index = conversations.findIndex(item => item.id === fresh.id);
      if (index >= 0) {
        conversations[index] = fresh;
      } else {
        conversations.unshift(fresh);
      }
      conversations = simplifyConversations(conversations);
      activeConversationId = fresh.id;
      renderAll();
      showToast('已打开新客户演示单', 'info');
    }

    function viewPlanDetail() {
      const conv = currentConversation();
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '我展开了当前方案的运营视角：重点看每日移动距离、资源确认状态和适合客户沟通的卖点。',
        cards: [{ type: 'task', title: '方案详情摘要', rows: [['行程节奏', conv.itinerary?.length ? '已生成，可继续微调' : '尚未生成'], ['资源状态', conv.quote ? '已有报价，部分资源需复核' : '未生成报价'], ['沟通重点', conv.notes?.[0] || '待补充客户偏好']] }]
      });
    }

    function requestAdjustment() {
      const conv = currentConversation();
      if (!conv.itinerary || !conv.itinerary.length) {
        showToast('当前还没有可调整的行程', 'warning');
        return;
      }

      showDetailModal('调整行程', `
        <div class="form-group">
          <label class="form-label">调整方式</label>
          <select class="form-select" id="adjustMode">
            <option value="replace">替换某一天内容</option>
            <option value="insert">插入一天自由活动</option>
            <option value="delete">删除某一天</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">选择天数</label>
          <select class="form-select" id="adjustDay">
            ${conv.itinerary.map((item, index) => `<option value="${index}">${escapeHtml(item[0])} · ${escapeHtml(item[1])}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">新行程内容</label>
          <textarea class="form-textarea" id="adjustText" rows="3" placeholder="例如：改成巴黎自由活动，上午酒店休息，下午塞纳河游船"></textarea>
        </div>
        <div class="panel-note warning">调整后会保存为新的方案版本，并在右侧线路面板实时更新。</div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="applyItineraryAdjustment()">确认调整</button>
      `);
    }

    function adjustQuote() {
      const conv = currentConversation();
      if (!conv.quote) {
        showToast('当前还没有报价明细可调整', 'warning');
        return;
      }

      showDetailModal('调整报价明细', `
        <div class="form-group">
          <label class="form-label">调整项</label>
          <select class="form-select" id="quoteAdjustItem">
            <option value="hotel">酒店降一档（-8%）</option>
            <option value="flight">机票改转机（-12%）</option>
            <option value="guide">减少导游天数（-¥1,200）</option>
            <option value="service">增加服务费（+¥1,500）</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">备注</label>
          <textarea class="form-textarea" id="quoteAdjustNote" rows="3" placeholder="例如：客户要求总价压到5万内，优先调整酒店和机票"></textarea>
        </div>
        <div class="panel-note">调整后会重新计算总价，并保存为新的报价版本。</div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="applyQuoteAdjustment()">确认调整</button>
      `);
    }

    function applyItineraryAdjustment() {
      const conv = currentConversation();
      const mode = document.getElementById('adjustMode').value;
      const index = Number(document.getElementById('adjustDay').value || 0);
      const text = document.getElementById('adjustText').value.trim();

      if (mode !== 'delete' && !text) {
        showToast('请填写新的行程内容', 'warning');
        return;
      }

      if (mode === 'replace') {
        conv.itinerary[index][1] = text;
      } else if (mode === 'insert') {
        conv.itinerary.splice(index + 1, 0, ['新增', text]);
      } else if (mode === 'delete') {
        conv.itinerary.splice(index, 1);
      }

      conv.stage = '持续修改中';
      conv.stageClass = 'rework';
      conv.status = 'rework';
      conv.statusText = '行程已调整 · 等待客户确认新版';
      conv.notes = ['行程刚被人工调整，请重新检查报价和资源库存。', ...(conv.notes || []).slice(0, 1)];
      closeModal('globalDetailModal');
      syncConversationToPlan(conv, null, '行程调整');
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '行程已调整，并保存为新的方案版本。我建议现在刷新报价，确认受影响资源是否仍有库存。',
        quickReplies: ['重新报价', '生成新版行程单', '继续调整']
      });
      showToast('行程已调整', 'success');
    }

    function applyQuoteAdjustment() {
      const conv = currentConversation();
      const item = document.getElementById('quoteAdjustItem').value;
      const note = document.getElementById('quoteAdjustNote').value.trim();
      let total = parseMoney(conv.quote.total);

      if (item === 'hotel') total = Math.round(total * 0.92);
      if (item === 'flight') total = Math.round(total * 0.88);
      if (item === 'guide') total = Math.max(0, total - 1200);
      if (item === 'service') total += 1500;

      const peopleText = (conv.requirements || []).find(req => req.label === '人数')?.value || '';
      const people = Math.max(1, Number(peopleText.match(/\d+/)?.[0] || 3));
      conv.quote.total = AppStore.money(total);
      conv.quote.perPerson = '人均 ' + AppStore.money(Math.round(total / people)) + (note ? ' · ' + note : '');
      conv.quote.title = conv.quote.title.includes('调整后') ? conv.quote.title : conv.quote.title + '（调整后）';
      conv.stage = '报价已调整';
      conv.stageClass = 'pending';
      conv.status = 'pending';
      conv.statusText = '报价已调整 · 待客户确认';
      conv.notes = ['报价已人工调整，建议发送前再次核对利润率。', ...(conv.notes || []).slice(0, 1)];

      closeModal('globalDetailModal');
      syncConversationToPlan(conv, null, '报价调整');
      addMessage({
        role: 'ai',
        time: nowTime(),
        text: '报价明细已调整，新的总价为 ' + conv.quote.total + '。已保存为新的报价版本。',
        cards: [{
          type: 'quote',
          title: conv.quote.title,
          total: conv.quote.total,
          note: conv.quote.perPerson,
          items: conv.quote.items.map(row => [row[0], row[1], row[2]])
        }]
      });
      showToast('报价已调整并保存版本', 'success');
    }

    function handlePanelAction(type, button) {
      if (button) {
        runWithButtonLoading(button, '生成中...', () => handlePanelAction(type), 650);
        return;
      }
      const conv = currentConversation();
      if ((type === 'pdf' || type === 'quote') && !conv.quote) {
        showToast('当前方案还没有报价，建议先生成报价', 'warning');
        return;
      }

      const actionMap = {
        pdf: ['行程单PDF', '已生成客户版行程单 PDF，包含行程亮点、每日安排和费用说明。'],
        poster: ['朋友圈海报', '已生成朋友圈海报草稿，主图和卖点文案可继续微调。'],
        quote: ['报价单', '已导出内部报价单，含成本价、销售价和供应商来源。']
      };
      const [label, text] = actionMap[type];
      const plan = syncConversationToPlan(conv);
      if (plan) {
        AppStore.addDocumentToPlan(plan.id, {
          name: label,
          type,
          status: '已生成'
        });
        showDocumentPreview(label, plan);
      }
      addMessage({
        role: 'ai',
        time: nowTime(),
        text,
        cards: [{ type: 'doc', title: label, meta: conv.title + ' · 模拟生成时间 ' + nowTime(), actions: ['预览', '下载', '保存到方案管理'] }]
      });
      showToast(label + '已生成', 'success');
    }

    function exportConversation() {
      showToast('已导出当前对话记录（模拟）', 'success');
    }

    function showConversationMenu(event) {
      openConversationMenu(event, activeConversationId);
    }

    function openConversationMenu(event, id) {
      event.preventDefault();
      event.stopPropagation();
      const menu = document.getElementById('conversationMenu');
      menu.innerHTML = `
        <button onclick="renameConversation('${id}')">重命名</button>
        <button onclick="duplicateConversation('${id}')">复制对话</button>
        <button onclick="archiveConversation('${id}')">归档对话</button>
        <button class="danger" onclick="deleteConversation('${id}')">删除对话</button>
      `;
      menu.style.left = Math.min(event.clientX, window.innerWidth - 170) + 'px';
      menu.style.top = Math.min(event.clientY, window.innerHeight - 170) + 'px';
      menu.classList.add('show');
    }

    function closeConversationMenu() {
      document.getElementById('conversationMenu').classList.remove('show');
    }

    function renameConversation(id) {
      closeConversationMenu();
      const conv = conversations.find(item => item.id === id);
      if (!conv) return;
      showDetailModal('重命名对话', `
        <div class="form-group">
          <label class="form-label">对话标题</label>
          <input class="form-input" id="renameConversationInput" value="${escapeHtml(conv.title)}">
        </div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="saveConversationName('${id}')">保存</button>
      `);
    }

    function saveConversationName(id) {
      const conv = conversations.find(item => item.id === id);
      const value = document.getElementById('renameConversationInput').value.trim();
      if (!conv || !value) {
        showToast('标题不能为空', 'warning');
        return;
      }
      conv.title = value;
      closeModal('globalDetailModal');
      renderAll();
      showToast('对话已重命名', 'success');
    }

    function duplicateConversation(id) {
      closeConversationMenu();
      const conv = conversations.find(item => item.id === id);
      if (!conv) return;
      const copy = JSON.parse(JSON.stringify(conv));
      copy.id = 'copy-' + Date.now();
      copy.title = conv.title + '（复制）';
      copy.stage = '需求收集中';
      copy.stageClass = 'draft';
      copy.status = 'draft';
      copy.statusText = '复制草稿 · 可继续编辑';
      copy.time = '刚刚';
      copy.preview = '从历史对话复制的新草稿';
      copy.messages = [
        { role: 'system', text: '已从“' + conv.title + '”复制为新对话草稿' },
        ...(copy.messages || []).slice(-3)
      ];
      conversations.unshift(copy);
      activeConversationId = copy.id;
      renderAll();
      showToast('已复制为新客户对话', 'success');
    }

    function archiveConversation(id) {
      closeConversationMenu();
      const conv = conversations.find(item => item.id === id);
      if (!conv) return;
      conv.stage = '已归档';
      conv.stageClass = 'archived';
      conv.status = 'archived';
      conv.statusText = '对话已归档';
      conv.preview = '对话已归档';
      conv.time = '刚刚';
      renderAll();
      showToast('对话已归档', 'success');
    }

    function deleteConversation(id) {
      closeConversationMenu();
      const conv = conversations.find(item => item.id === id);
      if (!conv) return;
      confirmAction('删除对话：' + conv.title + '？此操作只删除原型中的模拟对话。', () => {
        conversations = conversations.filter(item => item.id !== id);
        if (!conversations.length) {
          newConversation();
          return;
        }
        activeConversationId = conversations[0].id;
        renderAll();
        showToast('对话已删除', 'success');
      }, '删除对话');
    }

    function mockAttachImage() {
      addMessage({ role: 'system', text: '已上传 1 张客户参考图片（模拟）' });
      showToast('图片已加入当前对话上下文', 'success');
    }

    function mockVoiceInput() {
      chatInput.value = '客户语音转写：想要行程轻松一点，酒店位置方便，预算不要超太多';
      chatInput.focus();
      showToast('语音已转写到输入框', 'info');
    }

    function handleDocCardAction(action) {
      if (action.includes('PDF') || action.includes('行程单')) {
        handlePanelAction('pdf');
        return;
      }
      if (action.includes('海报')) {
        handlePanelAction('poster');
        return;
      }
      if (action.includes('报价')) {
        handlePanelAction('quote');
        return;
      }
      if (action.includes('复制')) {
        const plan = syncConversationToPlan(currentConversation());
        if (plan) AppStore.duplicatePlan(plan.id);
        showToast('已复制为新草稿方案', 'success');
        return;
      }
      showToast(action + '完成（模拟）', 'success');
    }

    renderAll();
    document.addEventListener('click', closeConversationMenu);
  </script>
</body>
</html>
