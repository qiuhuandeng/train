<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源成本库 - AI智能计调助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .pricing-content {
      padding-top: calc(var(--nav-height) + 24px);
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 24px;
      height: 100vh;
      overflow-y: auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .resource-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-sidebar);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .panel-meta {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .resource-table {
      min-width: 1120px;
    }

    .resource-table th,
    .resource-table td {
      vertical-align: top;
    }

    .resource-name {
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .resource-sub {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .category-badge,
    .status-badge,
    .match-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      margin: 0 4px 5px 0;
      background: var(--bg-sidebar);
      color: var(--text-secondary);
    }

    .status-valid,
    .match-ready {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-expiring,
    .match-warning {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status-expired,
    .match-missing {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .status-realtime {
      background: var(--info-bg);
      color: var(--info);
    }

    .price-main {
      color: var(--primary);
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
    }

    .action-stack {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 220px;
    }

    .condition-text {
      max-width: 280px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .missing-row td {
      background: var(--warning-bg);
    }

    .formula-box {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-sidebar);
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .pricing-content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .panel-head {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <div class="pricing-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">资源成本库</h1>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" onclick="openImportModal()">导入价格表</button>
        <button class="btn btn-primary" onclick="openResourceEditor()">＋ 添加资源</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="text" class="form-input" id="keywordFilter" style="width:220px;" placeholder="搜索资源、供应商、城市...">
      <select class="form-select" id="categoryFilter" style="width:150px;">
        <option>所有品类</option>
        <option>酒店</option>
        <option>用车</option>
        <option>导游</option>
        <option>门票</option>
        <option>餐费</option>
        <option>保险</option>
        <option>机票</option>
        <option>火车</option>
        <option>会议室</option>
      </select>
      <select class="form-select" id="statusFilter" style="width:150px;">
        <option>所有状态</option>
        <option>有效</option>
        <option>即将过期</option>
        <option>已过期</option>
        <option>实时</option>
      </select>
      <button class="btn btn-secondary" onclick="renderResources()">筛选</button>
    </div>

    <div class="resource-panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">资源成本台账</div>
          <div class="panel-meta" id="panelMeta"></div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="showFormulaGuide()">报价公式说明</button>
      </div>
      <div class="table-wrapper" style="border:0;border-radius:0;">
        <table class="resource-table">
          <thead id="resourceHead"></thead>
          <tbody id="resourceBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    renderNavbar('pricing');

    let pendingImportRows = [];
    let latestMissingNeeds = [];
    sessionStorage.removeItem('pricingFromComponentId');

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parsePeriodEnd(period) {
      if (!period || period === '实时' || period === '长期有效') return null;
      const parts = String(period).split(/\s*-\s*/);
      const end = parts[parts.length - 1];
      const dateParts = end.split(/[./-]/).map(Number);
      if (dateParts.length >= 3) return new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
      if (dateParts.length >= 2) return new Date(dateParts[0], dateParts[1], 0);
      return null;
    }

    function effectiveStatus(price) {
      return AppStore.priceStatus(price);
    }

    function statusText(status) {
      return { valid: '有效', expiring: '即将过期', expired: '已过期', realtime: '实时' }[status] || status;
    }

    function requiredResources(seg) {
      return AppStore.componentNeeds(seg);
    }

    function categoryForNeed(need) {
      const resource = typeof need === 'string' ? need : (need.resource || need.category || '');
      return AppStore.categoryForRequirement(resource);
    }

    function matchesNeed(price, need, component) {
      return AppStore.matchPricesForNeed(need, component || { from: need.from, to: need.to }, [price]).length > 0;
    }

    function missingNeeds() {
      const data = AppStore.all();
      const needs = [];
      data.segments.filter(seg => seg.status !== 'rejected').forEach(seg => {
        requiredResources(seg).forEach(resourceNeed => {
          const need = {
            ...resourceNeed,
            id: seg.id + '-' + resourceNeed.key,
            componentId: seg.id,
            component: `${seg.from} → ${seg.to}`,
            from: seg.from,
            to: seg.to
          };
          if (!AppStore.matchPricesForNeed(need, seg, data.prices).length) needs.push(need);
        });
      });
      const seen = new Set();
      latestMissingNeeds = needs.filter(need => {
        const key = [need.component, need.resource, need.category, need.city].join('|');
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      return latestMissingNeeds;
    }

    function conditionFor(price) {
      if (price.condition) return price.condition;
      const map = {
        酒店: '按间夜报价，需确认房型、早餐、入住日期和取消规则。',
        机票: '按人/航段报价，税费和舱位以实时接口为准。',
        火车: '按人/区间报价，席别和出票规则需二次确认。',
        门票: '按人/次报价，需确认预约时段、儿童政策和闭馆日。',
        导游: '按天报价，默认 8-10 小时服务，超时另计。',
        餐费: '按人/餐报价，团队菜单和特殊餐需提前确认。',
        保险: '按人或按团报价，需确认保障地区、天数、年龄和保额。',
        用车: '按车/天报价，需确认车型、座位数、服务小时和超公里规则。',
        会议室: '按半日/日报价，茶歇、投影、摆台方式另计。'
      };
      return map[price.category] || '需确认适用日期、人数、库存和供应商取消政策。';
    }

    function formulaFor(price) {
      if (price.formula) return price.formula;
      const map = {
        酒店: '间数 × 晚数 × 间夜价',
        机票: '人数 × 航段票价',
        火车: '人数 × 区间票价',
        门票: '成人数 × 成人票 + 儿童数 × 儿童票',
        导游: '服务天数 × 日服务费',
        餐费: '人数 × 餐数 × 餐标',
        保险: '人数 × 天数 × 保费，或按团固定金额',
        用车: '用车天数 × 日车价 + 超时/停车/高速',
        会议室: '场次 × 半日价 + 茶歇/设备费用'
      };
      return map[price.category] || '数量 × 单价';
    }

    function markupFor(price) {
      if (price.markup) return price.markup;
      if (price.source === 'API') return '实时成本 + 服务费';
      if (price.category === '酒店') return '成本价 + 8%-12%';
      if (price.category === '导游' || price.category === '用车') return '成本价 + 10%';
      return '成本价 + 5%-10%';
    }

    function referencedComponents(price) {
      const data = AppStore.all();
      return data.segments.filter(seg => {
        if (seg.status === 'rejected') return false;
        return requiredResources(seg).some(need => matchesNeed(price, need, seg));
      });
    }

    function normalizedPrices() {
      return AppStore.all().prices.map(price => ({
        ...price,
        computedStatus: effectiveStatus(price),
        condition: conditionFor(price),
        formula: formulaFor(price),
        markup: markupFor(price),
        references: referencedComponents(price)
      }));
    }

    function viewMatches(price) {
      return true;
    }

    function filteredPrices() {
      const keyword = (document.getElementById('keywordFilter')?.value || '').trim().toLowerCase();
      const category = document.getElementById('categoryFilter')?.value || '所有品类';
      const status = document.getElementById('statusFilter')?.value || '所有状态';
      return normalizedPrices().filter(price => {
        if (!viewMatches(price)) return false;
        if (category !== '所有品类' && price.category !== category && !(category === '用车' && /车|接送/.test(price.name))) return false;
        if (status !== '所有状态' && statusText(price.computedStatus) !== status) return false;
        if (keyword) {
          const haystack = [price.category, price.city, price.name, price.supplier, price.condition, price.formula].join(' ').toLowerCase();
          if (!haystack.includes(keyword)) return false;
        }
        return true;
      });
    }

    function renderResources() {
      document.getElementById('panelMeta').textContent = '展示可参与方案报价的供应商资源、计价规则和适用条件';
      renderPriceTable();
      hydrateLineIcons();
    }

    function renderPriceTable() {
      document.getElementById('resourceHead').innerHTML = `
        <tr>
          <th>资源名称</th>
          <th>品类/城市</th>
          <th>适用条件</th>
          <th>成本与公式</th>
          <th>有效期/状态</th>
          <th>被引用</th>
          <th>操作</th>
        </tr>
      `;
      const prices = filteredPrices();
      const tbody = document.getElementById('resourceBody');
      if (!prices.length) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-text">没有匹配资源</div><div class="empty-sub">请调整筛选条件，或添加新的资源成本。</div></div></td></tr>';
        return;
      }

      tbody.innerHTML = prices.map(price => `
        <tr>
          <td>
            <div class="resource-name">${esc(price.name)}</div>
            <div class="resource-sub">${esc(price.supplier || '未标注供应商')}</div>
          </td>
          <td>
            <span class="category-badge">${esc(price.category)}</span>
            <div class="resource-sub">${esc(price.city)}</div>
          </td>
          <td><div class="condition-text">${esc(price.condition)}</div></td>
          <td>
            <div class="price-main">${AppStore.money(price.price)}</div>
            <div class="resource-sub">${esc(price.unit)} · ${esc(price.formula)}</div>
            <div class="resource-sub">${esc(price.markup)}</div>
          </td>
          <td>
            <span class="status-badge status-${esc(price.computedStatus)}">${esc(statusText(price.computedStatus))}</span>
            <div class="resource-sub">${esc(price.period)}</div>
          </td>
          <td>
            ${price.references.length
              ? price.references.slice(0, 2).map(seg => `<span class="match-badge match-ready">${esc(seg.from)}→${esc(seg.to)}</span>`).join('')
              : '<span class="match-badge match-warning">暂无引用</span>'}
          </td>
          <td>
            <div class="action-stack">
              ${price.computedStatus === 'expired' || price.computedStatus === 'expiring' ? `<button class="btn btn-sm btn-secondary" onclick="renewPrice('${price.id}')">续期</button>` : ''}
              ${price.source === 'API' ? `<button class="btn btn-sm btn-secondary" onclick="refreshPrice('${price.id}')">刷新</button>` : `<button class="btn btn-sm btn-secondary" onclick="openResourceEditor('${price.id}')">编辑</button>`}
              <button class="btn btn-sm btn-ghost" style="color:var(--danger);" onclick="deletePrice('${price.id}')">删除</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderMissingTable() {
      const needs = missingNeeds();
      document.getElementById('resourceHead').innerHTML = `
        <tr>
          <th>缺少资源</th>
          <th>关联组件</th>
          <th>匹配城市/区间</th>
          <th>建议补价字段</th>
          <th>优先级</th>
          <th>操作</th>
        </tr>
      `;
      const tbody = document.getElementById('resourceBody');
      if (!needs.length) {
        tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><div class="empty-text">暂无缺价需求</div><div class="empty-sub">当前行程组件都已匹配可用资源。</div></div></td></tr>';
        return;
      }

      tbody.innerHTML = needs.map((need, index) => `
        <tr class="missing-row">
          <td>
            <div class="resource-name">${esc(need.resource)}</div>
            <div class="resource-sub">建议品类：${esc(categoryForNeed(need))}</div>
          </td>
          <td>${esc(need.component)}</td>
          <td>${esc(need.from)} / ${esc(need.to)}</td>
          <td><div class="condition-text">${esc(suggestFields(need.resource))}</div></td>
          <td><span class="match-badge ${/酒店|用车|司导|会议室/.test(need.resource) ? 'match-missing' : 'match-warning'}">${/酒店|用车|司导|会议室/.test(need.resource) ? '高' : '中'}</span></td>
          <td><button class="btn btn-sm btn-primary" onclick="addMissingPrice(${index})">补价格</button></td>
        </tr>
      `).join('');
    }

    function suggestFields(resource) {
      const map = {
        酒店: '酒店名、星级、房型、间夜价、早餐、取消规则、有效期',
        用车: '车型、座位数、服务小时、日车价、超时费、停车高速',
        司导: '语言、服务城市、服务时长、日服务费、超时费',
        会议室: '酒店/场地、半日价、摆台方式、投影、茶歇',
        餐食: '餐厅/餐标、人数、菜单、特殊餐、有效期',
        保险: '保障地区、保障天数、人数、保额、年龄限制、供应商',
        '门票/活动': '景点/项目、成人价、儿童价、团队价、预约规则',
        区间交通: '区间、席别、成人价、儿童价、出票规则',
        '机票/内陆交通': '航段、舱位、票价、税费、实时接口或供应商'
      };
      return map[resource] || '资源名称、供应商、单价、单位、有效期、适用条件';
    }

    function addMissingPrice(index) {
      const need = latestMissingNeeds[index];
      if (!need) return;
      openResourceEditor('', {
        category: categoryForNeed(need),
        city: need.to || need.from,
        name: `${need.component} ${need.resource}`,
        supplier: '待确认供应商',
        unit: defaultUnit(categoryForNeed(need)),
        condition: suggestFields(need.resource),
        formula: formulaFor({ category: categoryForNeed(need) }),
        markup: '成本价 + 10%'
      });
    }

    function defaultUnit(category) {
      return {
        酒店: '间/晚',
        用车: '车/天',
        导游: '天',
        会议室: '半日',
        餐费: '人/餐',
        保险: '人/天',
        门票: '人/次',
        火车: '人/单程',
        机票: '人/航段'
      }[category] || '项';
    }

    function openResourceEditor(id = '', preset = {}) {
      const price = id ? AppStore.all().prices.find(item => item.id === id) : null;
      const source = price || preset || {};
      showDetailModal(price ? '编辑资源成本' : '添加资源成本', `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group">
            <label class="form-label">品类</label>
            <select class="form-select" id="editCategory">
              ${['酒店','用车','导游','门票','餐费','保险','机票','火车','会议室','其他'].map(category => `<option ${source.category === category ? 'selected' : ''}>${category}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label class="form-label">城市/区间</label><input class="form-input" id="editCity" value="${esc(source.city || '')}"></div>
        </div>
        <div class="form-group"><label class="form-label">资源名称</label><input class="form-input" id="editName" value="${esc(source.name || '')}"></div>
        <div class="form-group"><label class="form-label">供应商</label><input class="form-input" id="editSupplier" value="${esc(source.supplier || '')}"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
          <div class="form-group"><label class="form-label">成本价</label><input class="form-input" id="editAmount" type="number" value="${esc(source.price || '')}"></div>
          <div class="form-group"><label class="form-label">单位</label><input class="form-input" id="editUnit" value="${esc(source.unit || '')}"></div>
          <div class="form-group"><label class="form-label">有效期</label><input class="form-input" id="editPeriod" value="${esc(source.period || '长期有效')}"></div>
        </div>
        <div class="form-group"><label class="form-label">适用条件</label><textarea class="form-textarea" id="editCondition" rows="3">${esc(conditionFor(source))}</textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div class="form-group"><label class="form-label">计价公式</label><input class="form-input" id="editFormula" value="${esc(formulaFor(source))}"></div>
          <div class="form-group"><label class="form-label">销售加价规则</label><input class="form-input" id="editMarkup" value="${esc(markupFor(source))}"></div>
        </div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="saveResource('${esc(id)}')">保存</button>
      `);
    }

    function saveResource(id = '') {
      const patch = {
        category: document.getElementById('editCategory').value,
        city: document.getElementById('editCity').value.trim(),
        name: document.getElementById('editName').value.trim(),
        supplier: document.getElementById('editSupplier').value.trim(),
        price: Number(document.getElementById('editAmount').value || 0),
        unit: document.getElementById('editUnit').value.trim(),
        period: document.getElementById('editPeriod').value.trim() || '长期有效',
        condition: document.getElementById('editCondition').value.trim(),
        formula: document.getElementById('editFormula').value.trim(),
        markup: document.getElementById('editMarkup').value.trim(),
        source: '手工',
        status: 'valid'
      };
      if (!patch.city || !patch.name || !patch.price || !patch.unit) {
        showToast('请填写城市/区间、资源名称、成本价和单位', 'warning');
        return;
      }
      if (id) {
        AppStore.updatePrice(id, patch);
      } else {
        AppStore.addPrice(patch);
      }
      closeModal('globalDetailModal');
      showToast('资源成本已保存', 'success');
      renderResources();
    }

    function renewPrice(id) {
      AppStore.updatePrice(id, { period: '2026.08 - 2027.08', status: 'valid' });
      showToast('价格已续期至 2027.08', 'success');
      renderResources();
    }

    function refreshPrice(id) {
      const price = AppStore.all().prices.find(item => item.id === id);
      if (!price) return;
      const next = Math.round(Number(price.price || 0) * (0.98 + Math.random() * 0.06));
      AppStore.updatePrice(id, { price: next, period: '实时', status: 'realtime' });
      showToast('实时价格已刷新', 'success');
      renderResources();
    }

    function deletePrice(id) {
      const price = AppStore.all().prices.find(item => item.id === id);
      if (!price) return;
      confirmAction(`删除资源成本：${price.city} · ${price.name}？`, () => {
        AppStore.deletePrice(id);
        showToast('资源成本已删除', 'success');
        renderResources();
      });
    }

    function openImportModal() {
      pendingImportRows = [];
      showDetailModal('导入价格表', `
        <div class="formula-box">
          支持导入地接报价单、酒店协议价、门票活动表、用车/导游报价表。系统会先识别品类，再做字段映射和重复价格检测。
        </div>
        <div class="form-group">
          <label class="form-label">选择文件</label>
          <input class="form-input" type="file" accept=".xlsx,.xls,.csv" onchange="previewPriceImport(event)">
        </div>
        <div id="priceImportPreview"></div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">取消</button>
        <button class="btn btn-primary" onclick="importPriceTable(this)">确认导入</button>
      `);
    }

    function previewPriceImport(e) {
      const existing = AppStore.all().prices;
      pendingImportRows = [
        { category: '会议室', city: '东京', name: '东京商务酒店会议室 半日', supplier: '东京地接社', price: 8000, unit: '半日', period: '2026.08 - 2027.03', source: '手工', status: 'valid', condition: 'U型桌、投影、基础茶水，茶歇另计。', formula: '场次 × 半日价 + 茶歇/设备费用', markup: '成本价 + 10%' },
        { category: '用车', city: '东京', name: '东京商务车 18座 全天', supplier: '东京车队A', price: 3600, unit: '车/天', period: '2026.08 - 2027.03', source: '手工', status: 'valid', condition: '10小时/天，超时和停车高速另计。', formula: '用车天数 × 日车价 + 超时/停车/高速', markup: '成本价 + 10%' }
      ].map(row => ({ ...row, duplicate: existing.some(item => item.city === row.city && item.name === row.name) }));

      const target = document.getElementById('priceImportPreview');
      if (!target) return;
      target.innerHTML = `
        <div class="panel-note warning" style="margin-bottom:12px;">已解析：${esc(e.target.files?.[0]?.name || '模拟地接报价表.xlsx')}。发现 ${pendingImportRows.filter(row => row.duplicate).length} 条疑似重复。</div>
        <table>
          <thead><tr><th>处理</th><th>品类</th><th>城市</th><th>资源</th><th>成本价</th></tr></thead>
          <tbody>${pendingImportRows.map(row => `
            <tr>
              <td><span class="match-badge ${row.duplicate ? 'match-warning' : 'match-ready'}">${row.duplicate ? '更新' : '新增'}</span></td>
              <td>${esc(row.category)}</td>
              <td>${esc(row.city)}</td>
              <td>${esc(row.name)}</td>
              <td>${AppStore.money(row.price)}</td>
            </tr>
          `).join('')}</tbody>
        </table>
      `;
      showToast('价格表已解析，请检查后导入', 'info');
    }

    function importPriceTable(button) {
      if (!pendingImportRows.length) {
        previewPriceImport({ target: { files: [{ name: '模拟地接报价表.xlsx' }] } });
        return;
      }
      runWithButtonLoading(button, '导入中...', () => {
        pendingImportRows.forEach(row => {
          const existing = AppStore.all().prices.find(item => item.city === row.city && item.name === row.name);
          const patch = { ...row };
          delete patch.duplicate;
          if (existing) AppStore.updatePrice(existing.id, patch);
          else AppStore.addPrice(patch);
        });
        closeModal('globalDetailModal');
        showToast(`已处理 ${pendingImportRows.length} 条资源成本`, 'success');
        pendingImportRows = [];
        renderResources();
      }, 700);
    }

    function showFormulaGuide() {
      showDetailModal('报价公式说明', `
        ${[
          ['酒店', '间数 × 晚数 × 间夜价，另算单房差、早餐和税费'],
          ['用车', '天数 × 日车价 + 超时费 + 停车/高速/夜间附加'],
          ['导游', '服务天数 × 日服务费，按语言和城市区分'],
          ['门票/活动', '成人数 × 成人价 + 儿童数 × 儿童价，检查预约和闭馆日'],
          ['餐食', '人数 × 餐数 × 餐标，特殊餐需单列'],
          ['保险', '按人/天或按团固定金额，报价前检查年龄、目的地和保额'],
          ['服务费/利润', '成本汇总后按比例或按团固定金额加价']
        ].map(row => `<div class="formula-box"><strong>${esc(row[0])}</strong><br>${esc(row[1])}</div>`).join('')}
      `);
    }

    document.querySelectorAll('.filter-bar .form-input, .filter-bar .form-select').forEach(el => {
      el.addEventListener('input', renderResources);
      el.addEventListener('change', renderResources);
    });

    renderResources();
  </script>
</body>
</html>
