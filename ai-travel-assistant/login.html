<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI智能计调助手 - 登录</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body {
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-page);
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 42vh;
      background: #EEF4FF;
      border-bottom: 1px solid var(--border);
    }

    .login-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 42px 38px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--primary);
      border-radius: var(--radius-xl);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px rgba(36, 87, 214, 0.18);
    }

    .login-logo .icon-line {
      width: 32px;
      height: 32px;
      color: white;
    }

    .login-title {
      font-size: 24px;
      font-weight: 780;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .login-form .form-group {
      margin-bottom: 20px;
    }

    .login-form .form-input {
      padding: 14px 16px;
      font-size: 15px;
      border-radius: var(--radius-lg);
    }

    .login-form .input-icon-wrapper {
      position: relative;
    }

    .login-form .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      color: var(--text-secondary);
    }

    .login-form .input-icon-wrapper .form-input {
      padding-left: 42px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 760;
      border-radius: var(--radius-lg);
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      transition: background 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 1px 0 rgba(23, 32, 51, 0.08);
    }

    .login-btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(36, 87, 214, 0.1);
    }

    .login-btn:active {
      box-shadow: none;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-container">
      <div class="login-card">
      <div class="login-header">
        <div class="login-logo" data-icon="plane"></div>
        <h1 class="login-title">AI智能计调助手</h1>
      </div>
      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <div class="input-icon-wrapper">
            <span class="input-icon" data-icon="user"></span>
            <input type="text" class="form-input" id="username" placeholder="请输入用户名" value="lijd">
          </div>
        </div>
        <div class="form-group">
          <div class="input-icon-wrapper">
            <span class="input-icon" data-icon="lock"></span>
            <input type="password" class="form-input" id="password" placeholder="请输入密码" value="123456">
          </div>
        </div>
        <button type="submit" class="login-btn">登 录</button>
        <div class="login-options">
          <label><input type="checkbox" checked> 记住登录</label>
          <a href="#">忘记密码？</a>
        </div>
      </form>
      <div class="login-footer">
        © 2025 AI智能计调助手 · 内部使用
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    hydrateLineIcons();

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.login-btn');
      btn.textContent = '登录中...';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'chat.html';
      }, 800);
    }
  </script>
</body>
</html>
