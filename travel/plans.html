<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案库 - AI智能计调助手</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .plans-content {
      padding-top: 20px;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 24px;
      height: 100vh;
      overflow-y: auto;
    }

    body.embedded .plans-content {
      padding-top: 20px;
      height: 100vh;
    }

    body.embedded .page-header .btn {
      display: none;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .ledger-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .ledger-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
    }

    .ledger-title {
      font-size: 14px;
      font-weight: 780;
      color: var(--text-primary);
    }

    .ledger-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .ledger-meta strong {
      color: var(--text-primary);
      font-weight: 780;
    }

    .ledger-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ledger-tools .form-input {
      width: 220px;
      height: 34px;
      padding-top: 6px;
      padding-bottom: 6px;
      background: var(--bg-card);
    }

    .plan-table {
      min-width: 980px;
    }

    .plan-table th,
    .plan-table td {
      vertical-align: top;
    }

    .plan-name {
      font-weight: 780;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .plan-sub {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .route-text {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      white-space: normal;
    }

    .status-cell {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 720;
    }

    .status-cell.pending {
      color: var(--warning);
      background: var(--warning-bg);
    }

    .status-cell.confirmed {
      color: var(--success);
      background: var(--success-bg);
    }

    .status-cell.draft {
      color: var(--text-muted);
      background: var(--bg-sidebar);
    }

    .status-cell.archived {
      color: var(--text-muted);
      background: var(--bg-sidebar);
    }

    .price-main {
      font-size: 15px;
      font-weight: 780;
      color: var(--primary);
      white-space: nowrap;
    }

    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .action-stack {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 260px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .detail-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: var(--bg-soft);
    }

    .detail-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .detail-item strong {
      font-size: 14px;
      color: var(--text-primary);
    }

    .itinerary-list {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      margin-bottom: 18px;
    }

    .itinerary-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
    }

    .itinerary-row:last-child {
      border-bottom: none;
    }

    .itinerary-day {
      font-weight: 700;
      color: var(--primary);
    }

    @media (max-width: 768px) {
      .plans-content {
        padding-left: 16px;
        padding-right: 16px;
      }

      .ledger-header {
        align-items: stretch;
        flex-direction: column;
      }

      .ledger-tools {
        flex-direction: column;
        align-items: stretch;
      }

      .ledger-tools .form-input,
      .ledger-tools .btn {
        width: 100%;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="plans-content">
    <div class="page-header">
      <h1 class="page-title">方案库</h1>
      <button class="btn btn-primary" onclick="location.href='chat.html'">回到 AI 对话</button>
    </div>

    <div class="ledger-panel">
      <div class="ledger-header">
        <div>
          <div class="ledger-title">当前方案台账</div>
          <div class="ledger-meta" id="ledgerMeta"></div>
        </div>
        <div class="ledger-tools">
          <input type="text" class="form-input" id="planSearch" placeholder="搜索客户、目的地、报价..." oninput="renderPlans()">
          <button class="btn btn-secondary" onclick="syncFromChat()">同步当前对话</button>
        </div>
      </div>
      <div class="table-wrapper" style="border:0;border-radius:0;">
        <table class="plan-table">
          <thead>
            <tr>
              <th>方案</th>
              <th>人数/天数</th>
              <th>报价</th>
              <th>文件</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="planTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
    const EMBEDDED_MODE = new URLSearchParams(location.search).get('embedded') === '1';
    if (EMBEDDED_MODE) {
      document.body.classList.add('embedded');
    }
    installVisualCleanup();

    const CURRENT_CONVERSATION_ID = 'new-intake';

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function defaultCurrentPlan() {
      const quote = AppStore.japanBusinessQuote();
      return {
        id: 'plan-new-intake',
        conversationId: CURRENT_CONVERSATION_ID,
        componentId: 'seg-japan-business-5d',
        title: '新客户 - 日本商务团5日',
        route: ['上海', '东京', '箱根', '上海'],
        status: 'pending',
        statusText: '待客户反馈',
        people: '18人',
        days: '5天4晚',
        hotel: '东京市区五星商务酒店',
        createdAt: '刚刚',
        total: quote.total,
        perPerson: quote.perPerson,
        summary: '东京商务拜访、酒店会议室、专车接送机和箱根轻团建，适合先给客户确认方向与预算。',
        itinerary: [
          ['Day1', '上海 → 东京，专车接机，入住银座/丸之内商圈酒店'],
          ['Day2', '上午客户拜访，下午商务接待，晚上团队晚宴'],
          ['Day3', '酒店会议室半日，下午银座自由商务活动'],
          ['Day4', '东京 → 箱根，温泉酒店 + 轻团建'],
          ['Day5', '箱根 → 东京机场，专车送机返程']
        ],
        quoteItems: quote.items.map(item => [item.name, item.amount, item.status]),
        quoteLines: quote.lines.map(line => ({
          resource: line.need.resource,
          quantity: line.need.quantity,
          unit: line.need.unit,
          priceName: line.price?.name || '缺价',
          amount: line.amount,
          status: line.status
        })),
        documents: ['初版报价单']
      };
    }

    function ensureCurrentPlan() {
      const data = AppStore.all();
      const defaults = defaultCurrentPlan();
      const existing = data.plans.find(plan => plan.conversationId === CURRENT_CONVERSATION_ID);
      if (!existing) return AppStore.addPlan(defaults);

      return AppStore.updatePlan(existing.id, {
        ...defaults,
        id: existing.id,
        documents: existing.documents || defaults.documents,
        versions: existing.versions,
        currentVersionId: existing.currentVersionId
      }) || existing;
    }

    function currentPlans() {
      return [ensureCurrentPlan()];
    }

    function planStatusLabel(status) {
      return {
        draft: '草稿',
        pending: '待客户反馈',
        confirmed: '已确认',
        traveling: '已出行',
        archived: '已归档'
      }[status] || status;
    }

    function documentsText(plan) {
      const docs = plan.documents || [];
      if (!docs.length) return '<span class="text-muted">暂无文件</span>';
      return docs.map(doc => {
        const name = typeof doc === 'string' ? doc : doc.name;
        const time = typeof doc === 'string' ? '' : doc.time;
        return `<span>${esc(name)}${time ? ' · ' + esc(time) : ''}</span>`;
      }).join('');
    }

    function renderSummary(plan) {
      const docs = (plan.documents || []).length;
      document.getElementById('ledgerMeta').innerHTML = `
        <span>当前客户 <strong>1 个</strong></span>
        <span>状态 <strong>${esc(plan.statusText || planStatusLabel(plan.status))}</strong></span>
        <span>报价 <strong>${AppStore.money(plan.total)}</strong></span>
        <span>文件 <strong>${docs} 份</strong></span>
      `;
    }

    function renderPlans() {
      const keyword = (document.getElementById('planSearch')?.value || '').trim().toLowerCase();
      const plans = currentPlans().filter(plan => {
        if (!keyword) return true;
        return [
          plan.title,
          plan.summary,
          plan.people,
          plan.days,
          plan.statusText,
          AppStore.money(plan.total),
          ...(plan.route || [])
        ].join(' ').toLowerCase().includes(keyword);
      });
      const current = currentPlans()[0];
      renderSummary(current);

      const tbody = document.getElementById('planTableBody');
      if (!plans.length) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-text">没有匹配方案</div><div class="empty-sub">请调整搜索关键词。</div></div></td></tr>';
        return;
      }

      tbody.innerHTML = plans.map(plan => `
        <tr onclick="viewPlan('${plan.id}')">
          <td>
            <div class="plan-name">${esc(plan.title)}</div>
            <div class="plan-sub">${esc(plan.summary)}</div>
            <div class="route-text">${esc((plan.route || []).join(' / '))}</div>
          </td>
          <td>
            <div><strong>${esc(plan.people)}</strong></div>
            <div class="plan-sub">${esc(plan.days)} · ${esc(plan.hotel)}</div>
          </td>
          <td>
            <div class="price-main">${AppStore.money(plan.total)}</div>
            <div class="plan-sub">人均 ${AppStore.money(plan.perPerson)}</div>
          </td>
          <td><div class="doc-list">${documentsText(plan)}</div></td>
          <td>
            <div class="action-stack">
              <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();editPlan('${plan.id}')">继续编辑</button>
              <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();generatePlanDoc('${plan.id}', 'PDF', this)">生成PDF</button>
              <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();generatePlanDoc('${plan.id}', '海报', this)">生成海报</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function viewPlan(id) {
      const plan = AppStore.all().plans.find(item => item.id === id) || ensureCurrentPlan();
      const requirementsHtml = [
        ['客户', '王总公司商务团'],
        ['人数', plan.people],
        ['天数', plan.days],
        ['目的地', (plan.route || []).slice(1, -1).join(' + ')],
        ['住宿', plan.hotel],
        ['预算', '总预算 220,000 元内']
      ].map(item => `
        <div class="detail-item">
          <span>${esc(item[0])}</span>
          <strong>${esc(item[1])}</strong>
        </div>
      `).join('');

      const itineraryHtml = (plan.itinerary || []).map(day => `
        <div class="itinerary-row">
          <span class="itinerary-day">${esc(day[0])}</span>
          <span>${esc(day[1])}</span>
        </div>
      `).join('');

      const quoteHtml = (plan.quoteItems || []).map(item => `
        <tr>
          <td>${esc(item[0])}</td>
          <td style="text-align:right;font-weight:700;">${AppStore.money(item[1])}</td>
          <td style="text-align:right;color:var(--text-muted);">${esc(item[2])}</td>
        </tr>
      `).join('');

      showDetailModal(plan.title, `
        <div class="detail-grid">${requirementsHtml}</div>
        <h4 style="margin-bottom:8px;">行程安排</h4>
        <div class="itinerary-list">${itineraryHtml}</div>
        <h4 style="margin-bottom:8px;">报价明细</h4>
        <table>
          <tbody>${quoteHtml}</tbody>
          <tfoot>
            <tr>
              <td style="font-weight:800;">合计</td>
              <td style="text-align:right;font-weight:800;color:var(--primary);">${AppStore.money(plan.total)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
        <h4 style="margin:18px 0 8px;">已生成文件</h4>
        <div class="doc-list">${documentsText(plan)}</div>
      `, `
        <button class="btn btn-secondary" onclick="closeModal('globalDetailModal')">关闭</button>
        <button class="btn btn-secondary" onclick="confirmPlan('${plan.id}')">标记已确认</button>
        <button class="btn btn-secondary" onclick="generatePlanDoc('${plan.id}', 'PDF', this)">生成PDF</button>
        <button class="btn btn-primary" onclick="editPlan('${plan.id}')">继续编辑</button>
      `);
    }

    function editPlan(id) {
      const plan = AppStore.all().plans.find(item => item.id === id) || ensureCurrentPlan();
      sessionStorage.setItem('openConversationId', plan.conversationId || CURRENT_CONVERSATION_ID);
      if (EMBEDDED_MODE && window.parent && window.parent !== window && typeof window.parent.switchWorkspace === 'function') {
        window.parent.switchWorkspace('chat');
      } else {
        location.href = 'chat.html';
      }
    }

    function generatePlanDoc(id, type, button) {
      if (button) {
        runWithButtonLoading(button, '生成中...', () => generatePlanDoc(id, type), 650);
        return;
      }
      const plan = AppStore.all().plans.find(item => item.id === id) || ensureCurrentPlan();
      const name = type === '海报' ? '朋友圈海报' : '行程单PDF';
      AppStore.addDocumentToPlan(plan.id, { name, type, status: '已生成' });
      const latest = AppStore.all().plans.find(item => item.id === plan.id) || plan;
      showToast(`${type}已生成并保存`, 'success');
      showDocumentPreview(name, latest);
      renderPlans();
    }

    function confirmPlan(id) {
      AppStore.updatePlan(id, { status: 'confirmed', statusText: '已确认' });
      closeModal('globalDetailModal');
      showToast('方案已标记为已确认', 'success');
      renderPlans();
    }

    function syncFromChat() {
      const plan = ensureCurrentPlan();
      showToast('已同步当前新客户方案', 'success');
      renderPlans();
      viewPlan(plan.id);
    }

    renderPlans();
  </script>
</body>
</html>
